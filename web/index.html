  <script id="mic-level-meter-script">
    window._audioContext = null;
    window._audioAnalyser = null;
    window._audioSource = null;
    window._audioStream = null;
    window._gainNode = null;

    window.startMicLevelMeter = async function() {
      try {
        if (window._audioStream) return;
        window._audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        window._audioContext = new AudioCtx();
        window._audioSource = window._audioContext.createMediaStreamSource(window._audioStream);
        window._gainNode = window._audioContext.createGain();
        window._audioAnalyser = window._audioContext.createAnalyser();
        window._audioAnalyser.fftSize = 64;
        window._audioSource.connect(window._gainNode);
        window._gainNode.connect(window._audioAnalyser);
      } catch (e) {
        console.warn("Mic level meter start error:", e);
      }
    };

    window.setMicGain = function(gainVal) {
      try {
        if (window._gainNode) {
          window._gainNode.gain.value = gainVal;
        }
      } catch (e) {
        console.warn("Mic gain set error:", e);
      }
    };

    window.stopMicLevelMeter = function() {
      try {
        if (window._audioStream) {
          window._audioStream.getTracks().forEach(function(t) { t.stop(); });
          window._audioStream = null;
        }
        if (window._audioContext) {
          window._audioContext.close();
          window._audioContext = null;
        }
        window._audioAnalyser = null;
        window._audioSource = null;
        window._gainNode = null;
      } catch (e) {
        console.warn("Mic level meter stop error:", e);
      }
    };

    window.getRealMicLevel = function() {
      if (!window._audioAnalyser) return 0.0;
      const dataArray = new Uint8Array(window._audioAnalyser.frequencyBinCount);
      window._audioAnalyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const average = sum / dataArray.length;
      return Math.min(1.0, Math.max(0.0, average / 50.0));
    };

    window.playTestChime = function() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        
        // Tone 1: C5 (523.25 Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(523.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.4);

        // Tone 2: E5 (659.25 Hz)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(659.25, now + 0.15);
        gain2.gain.setValueAtTime(0.3, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.55);

        // Tone 3: G5 (783.99 Hz)
        const osc3 = ctx.createOscillator();
        const gain3 = ctx.createGain();
        osc3.type = 'sine';
        osc3.frequency.setValueAtTime(783.99, now + 0.30);
        gain3.gain.setValueAtTime(0.4, now + 0.30);
        gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc3.connect(gain3);
        gain3.connect(ctx.destination);
        osc3.start(now + 0.30);
        osc3.stop(now + 0.85);
      } catch (e) {
        console.warn("Play test chime error:", e);
      }
    };
  </script>
