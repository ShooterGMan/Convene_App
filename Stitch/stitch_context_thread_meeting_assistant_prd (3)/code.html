<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Active Recording - Context Thread</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f06647",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221410",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        'diffused': '0 12px 32px rgba(240, 102, 71, 0.15)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .glass-overlay {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        /* Waveform Animation Simulation */
        .wave-bar {
            animation: pulse-height 1s infinite alternate ease-in-out;
            transform-origin: bottom;
        }
        
        .wave-bar:nth-child(2n) { animation-delay: 0.2s; animation-duration: 0.8s; }
        .wave-bar:nth-child(3n) { animation-delay: 0.4s; animation-duration: 1.2s; }
        .wave-bar:nth-child(5n) { animation-delay: 0.1s; animation-duration: 0.9s; }
        .wave-bar:nth-child(7n) { animation-delay: 0.5s; animation-duration: 1.1s; }

        @keyframes pulse-height {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        /* Pulse ring for recording active state */
        .recording-pulse {
            animation: ring-pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes ring-pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light h-screen w-screen overflow-hidden relative selection:bg-primary/20">
<!-- Mock Background Content (to show glassmorphism effect) -->
<div aria-hidden="true" class="absolute inset-0 z-0 p-6 flex flex-col gap-4 opacity-40 pointer-events-none">
<div class="h-12 w-48 bg-gray-200 rounded-lg"></div>
<div class="h-32 w-full bg-white rounded-xl shadow-sm"></div>
<div class="h-32 w-full bg-white rounded-xl shadow-sm"></div>
<div class="h-32 w-full bg-white rounded-xl shadow-sm"></div>
</div>
<!-- Active Recording Overlay -->
<main class="absolute inset-0 z-10 glass-overlay flex flex-col items-center justify-between py-12 px-6">
<!-- Top Section: Context -->
<div class="w-full flex justify-center items-center mt-8">
<div class="flex items-center gap-2 px-4 py-2 bg-white/50 rounded-full shadow-sm">
<div class="w-2.5 h-2.5 rounded-full bg-primary recording-pulse"></div>
<span class="text-sm font-semibold text-gray-800 tracking-wide uppercase">Recording: Design Sync</span>
</div>
</div>
<!-- Center Section: Timer & Waveform -->
<div class="flex flex-col items-center gap-12 w-full max-w-md">
<!-- Timer -->
<div class="text-center flex flex-col items-center justify-center">
<h1 class="text-[64px] leading-none font-extrabold text-gray-900 tracking-tighter" style="font-feature-settings: 'tnum' on, 'lnum' on;">
                    12:04
                </h1>
<p class="text-gray-500 font-medium mt-2">Active Session</p>
</div>
<!-- Dynamic Waveform Visualizer -->
<div class="w-full h-32 flex items-end justify-center gap-1.5 px-4 overflow-hidden">
<!-- Generative wave bars -->
<script>
                    for(let i=0; i<40; i++) {
                        const height = Math.random() * 100;
                        const opacity = 0.5 + (Math.random() * 0.5);
                        document.write(`<div class="w-2 bg-gradient-to-t from-primary/80 to-primary wave-bar rounded-t-full" style="height: ${height}%; opacity: ${opacity}"></div>`);
                    }
                </script>
</div>
</div>
<!-- Bottom Section: Actions -->
<div class="w-full max-w-sm flex flex-col items-center gap-8 mb-8">
<!-- Mark Important (Shared Component Logic applied as focused view exception - custom styling) -->
<button class="w-full group relative flex items-center justify-center gap-3 bg-white py-4 px-6 rounded-[32px] shadow-diffused active:scale-95 transition-all duration-200 border border-gray-100 hover:border-primary/20">
<div class="absolute inset-0 bg-primary/5 rounded-[32px] opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">
                    push_pin
                </span>
<span class="text-lg font-bold text-gray-900">Mark Important</span>
</button>
<!-- End Recording Button -->
<button class="w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center active:scale-90 transition-transform duration-200 shadow-xl hover:bg-black group" id="endRecordingBtn">
<div class="w-6 h-6 bg-red-500 rounded-sm group-hover:bg-red-400 transition-colors"></div>
</button>
<span class="text-sm font-medium text-gray-500 mt-[-20px]">End Session</span>
</div>
</main>
<!-- Simple interaction script -->
<script>
        document.getElementById('endRecordingBtn').addEventListener('click', function() {
            const mainEl = document.querySelector('main');
            
            // Shrink animation simulation
            mainEl.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            mainEl.style.transform = 'scale(0.9) translateY(20px)';
            mainEl.style.opacity = '0';
            
            setTimeout(() => {
                // In a real app, this would route to the Context Thread Loading screen
                console.log("Transitioning to Context Thread Generation...");
                mainEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full">
                        <div class="w-12 h-12 border-4 border-primary/30 border-t-primary rounded-full animate-spin"></div>
                        <p class="mt-4 font-semibold text-gray-800">Generating Context Thread...</p>
                    </div>
                `;
                mainEl.style.transform = 'scale(1) translateY(0)';
                mainEl.style.opacity = '1';
                mainEl.style.background = '#f8f6f6'; // Switch to background-light
                mainEl.style.backdropFilter = 'none';
            }, 400);
        });
    </script>
</body></html>
