<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meeting Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f06647",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221410",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'diffused': '0 12px 32px rgba(240, 102, 71, 0.15)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f6f6; /* Simulating the underlying screen */
        }
        
        /* Custom Scrollbar for the list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 20px;
        }
        
        /* Slide up animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Fade in animation for backdrop */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f06647;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #f06647;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e5e7eb;
            transition: all 0.3s;
        }
        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: #e5e7eb;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        .toggle-dot {
            top: 0.125rem;
            left: 0.125rem;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-checkbox:checked ~ .toggle-dot {
            transform: translateX(1.5rem);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>

</div>

<!-- Participant 4 (Excluded initially) -->
<div class="flex items-center justify-between group opacity-70 hover:opacity-100 transition-opacity">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center border border-gray-200 text-gray-500 font-bold text-lg">
                            EK

<!-- Sticky Bottom Action Bar -->
<div class="absolute bottom-0 left-0 right-0 p-6 bg-white border-t border-gray-100 bg-opacity-95 backdrop-blur-sm rounded-b-[32px]">
<button class="w-full bg-primary hover:bg-[#e05536] text-white font-bold py-4 px-6 rounded-lg shadow-diffused transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
                Start Session
            </button>
</div>
</div>
<script>
        // Simple script to handle input focus shifting bottom sheet if needed on mobile
        const input = document.querySelector('input[type="text"]');
        const sheet = document.querySelector('.max-w-md.bg-white');
        
        input.addEventListener('focus', () => {
            // In a real mobile environment, this helps ensure the sheet takes full height when keyboard appears
            sheet.style.height = '100vh';
            sheet.style.borderRadius = '0';
        });

        input.addEventListener('blur', () => {
            sheet.style.height = '85vh';
            sheet.style.borderTopLeftRadius = '32px';
            sheet.style.borderTopRightRadius = '32px';
        });
    </script>
</body></html>
