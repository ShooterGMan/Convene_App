name: convene
description: "Convene — AI-powered meeting summarization for teams"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  livekit_client: ^2.8.1
  cloud_functions: ^6.3.5
  shared_preferences: ^2.5.3
  firebase_messaging: ^16.4.3
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  audioplayers: ^6.1.0
  record: any
  qr_flutter: ^4.1.0
  table_calendar: ^3.2.1
  flutter_speed_dial: ^7.0.0
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "transparent"
    theme_color: "transparent"
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F1115"
  image: "assets/images/icon.png"
  android: true
  ios: true
  web: true
  android_12:
    color: "#0F1115"
    image: "assets/images/icon.png"
